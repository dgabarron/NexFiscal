name: NexFiscal build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar núcleo NF-e e cadastro A1
        run: dotnet test tests/NexFiscal.Capture.Tests/NexFiscal.Capture.Tests.csproj -c Release
      - name: Compilar portal ASP.NET Core
        run: dotnet build src/NexFiscal.Web/NexFiscal.Web.csproj -c Release
      - name: Compilar frontend shadcn Tailwind
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Testar funções e contratos HTTP do frontend
        working-directory: frontend
        run: npm test
      - name: Smoke test do portal local
        run: |
          set -euo pipefail
          dotnet run --no-build -c Release --project src/NexFiscal.Web/NexFiscal.Web.csproj > /tmp/nexfiscal-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/nexfiscal-smoke.log' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:5187/api/health > /tmp/nexfiscal-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          grep -q '"product":"NexFiscal"' /tmp/nexfiscal-health.json
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:5187/ > /tmp/nexfiscal-home.html
          grep -q 'NexFiscal' /tmp/nexfiscal-home.html

  windows-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar backend Windows
        run: dotnet build src/NexFiscal.Web/NexFiscal.Web.csproj -c Release
      - name: Compilar interface Windows
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Validar inicialização a partir de duas pastas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path "src/NexFiscal.Web/bin/Release/net8.0/NexFiscal.Web.exe").Path
          foreach ($folder in @(".", "src/NexFiscal.Web")) {
            $workDir = (Resolve-Path $folder).Path
            $process = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru
            try {
              $healthy = $false
              for ($attempt = 1; $attempt -le 30; $attempt++) {
                try {
                  $health = Invoke-RestMethod -Uri "http://127.0.0.1:5187/api/health" -TimeoutSec 2
                  if ($health.product -eq "NexFiscal") {
                    $healthy = $true
                    break
                  }
                } catch { Start-Sleep -Seconds 1 }
              }
              if (-not $healthy) { throw "Backend Windows não inicializou: $workDir" }
              $home = Invoke-WebRequest -Uri "http://127.0.0.1:5187/" -UseBasicParsing -TimeoutSec 3
              if ($home.Content -notmatch "NexFiscal") { throw "Frontend não servido: $workDir" }
            } finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
              Start-Sleep -Seconds 2
            }
          }
