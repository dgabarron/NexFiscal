name: NexFiscal V1 - CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Testes do frontend
        working-directory: frontend
        run: npm test
      - name: Compilar backend
        run: dotnet build NexFiscal.sln -c Release
      - name: Testes do backend (HANA simulado)
        run: dotnet test NexFiscal.sln -c Release --no-build
      - name: Smoke test local
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = if ($IsWindows) { (Resolve-Path "src/NexFiscal.Web/bin/Release/net8.0/NexFiscal.Web.exe").Path } else { (Get-Command dotnet).Source }
          $parameters = if ($IsWindows) { @() } else { @((Resolve-Path "src/NexFiscal.Web/bin/Release/net8.0/NexFiscal.Web.dll").Path) }
          $proc = Start-Process -FilePath $exe -ArgumentList $parameters -WorkingDirectory (Get-Location).Path -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:5187/api/health' -TimeoutSec 2
                if ($status.product -eq 'NexFiscal' -and $status.stage -eq 5) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'API não inicializou' }
            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:5187/' -TimeoutSec 3
            if ($page.Content -notmatch 'NexFiscal') { throw 'Frontend não disponível' }
            $hana = Invoke-RestMethod -Uri 'http://127.0.0.1:5187/api/setup/hana/status' -TimeoutSec 5
            if ($hana.configured -or $hana.state -ne 'not_configured') { throw 'Teste iniciou com HANA indevidamente configurado' }
            $body = @{ server = '127.0.0.1'; port = 39999; username = 'ci'; password = 'ci-sem-valor' } | ConvertTo-Json
            try {
              Invoke-RestMethod -Uri 'http://127.0.0.1:5187/api/setup/hana/test' -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 60 | Out-Null
              throw 'Teste de conexao deveria falhar sem HANA'
            } catch [Microsoft.PowerShell.Commands.HttpResponseException] {
              # Prova que o driver nativo SAP HANA carrega neste sistema e que o erro e classificado.
              $kind = ($_.ErrorDetails.Message | ConvertFrom-Json).kind
              if ($kind -notin 'connection_refused','connection_timeout','unreachable') { throw "Erro HANA inesperado: $kind" }
            }
            try {
              Invoke-RestMethod -Uri 'http://127.0.0.1:5187/api/companies' -TimeoutSec 10 | Out-Null
              throw 'Empresas deveria exigir HANA configurado'
            } catch [Microsoft.PowerShell.Commands.HttpResponseException] {
              $kind = ($_.ErrorDetails.Message | ConvertFrom-Json).kind
              if ($kind -ne 'hana_not_configured') { throw "Erro inesperado em empresas: $kind" }
            }
            $after = Invoke-RestMethod -Uri 'http://127.0.0.1:5187/api/setup/hana/status' -TimeoutSec 5
            if ($after.configured) { throw 'Falha de conexao nao pode salvar configuracao' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
